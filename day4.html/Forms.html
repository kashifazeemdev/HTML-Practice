<html lang="en">
<head>

    <title>Forms in HTML</title>
</head>
<body>
    <form action="">
        <div>
            <label for="Username"> Username :  </label>
            <input type="text"  placeholder="Enter Name" id="Username"> <!--I am for Username-->
        </div>
       <div>
          <label for="Password" >  Password : </label>
           <input type="password"  placeholder="Enter strong password" id="Password" >   <!--I am for Password-->
       </div>
      <div>
          <label for="Age"> Enter age :</label>
        <input type="number" placeholder="Enter your age" id="age"> <!--I am for Number-->
      </div>
        Time
        <input type="time"> <!--I am for Time-->
        <br>
        Color
        <input type="color" > <!--I am for Color-->
    </form> 
</body>
</html>
