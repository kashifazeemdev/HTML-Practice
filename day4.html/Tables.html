<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables in Html</title>
</head>
<body>
    <table>
        <caption>Hotel Menu</caption>
        <thead> <!---THis is table header-->
        <tr>
            <th>Item</th>
            <th>Price</th>
         </tr>
        </thead> 
        <tbody> <!--This is table body-->
        <tr>
            <td>Samosa</td>
            <td>30</td>
         </tr>
         <tr>
            <td>Chana</td>
            <td>50</td>
         </tr>
         <tr>
            <td>Chai</td>
            <td>100</td>
         </tr>
        </tbody> 
    </table>
</body>
</html>
