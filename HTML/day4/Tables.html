<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables in Html</title>
</head>
<body>
    <h2>Simple table :</h2>
    <table>
        <caption>Hotel Menu</caption>
        <thead> 
        <tr>
            <th>Item</th>
            <th>Price</th>
         </tr>
        </thead> 
        <tbody>
        <tr>
            <td>Samosa</td>
            <td>30</td>
         </tr>
         <tr>
            <td>Chana</td>
            <td>50</td>
         </tr>
         <tr>
            <td>Chai</td>
            <td>100</td>
         </tr>
        </tbody> 
    </table>
</body>
</html>
<hr>
 <h2> Updated table :</h2>
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update table</title>
</head>
<body>
      <table border="black">
    <caption>Hotel Menu</caption>
    <thead> <!---THis is table header-->
        <tr>
            <th rowspan="2">Item</th>
            <th colspan="2">Price</th>
        </tr>
        <tr>
            <th>PKR</th>
            <th>USD</th>
        </tr>
    </thead>
    <tbody>     <!--This is table body--> 
        <tr>
         <td>Samosa</td>
        <td>500</td>
        <td>1.25</td>
        </tr>
        <tr>
         <td>Chana</td>
        <td>1000</td>
        <td>2.25</td>
        </tr>
        <tr>
         <td>Chai</td>
        <td>1500</td>
        <td>3.25</td>
        </tr>
    </tbody>
    </table>
</body>
</html>
